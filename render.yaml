services:
  - type: web
    name: smart-campus
    env: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: php artisan migrate --force && php artisan db:seed --force && php -S 0.0.0.0:$PORT -t public
    envVars:
      - key: APP_NAME
        value: "SMART CAMPUS"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        value: base64:9k3jjpx7O+bRkmvaBIOe9ikF7hTFz11h42Tu+WmR+Pk=
      - key: DB_CONNECTION
        value: mysql
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
